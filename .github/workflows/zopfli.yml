name: Benchmark Zopfli on screenshot scanlines
on:
  push:
    branches: [zopfli-experiment]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: google/zopfli
          ref: bd64b2f0553d4f1ef4e6627647c5d9fc8c71ffc0
          path: zopfli-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ebiggers/libdeflate
          ref: 96836d7d9d10e3e0d53e6edb54eb908514e336c4
          path: libdeflate-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Build pinned Zopfli and check the zlib stream
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends emscripten clang-18 lld-18
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/AtticKnight/screenshot-png/d2b3f38d4568d73356717be224aba9d9e5629f27/vendor/zopfli.cjs' -o /tmp/screenshot-zopfli-baseline.cjs
          echo '2205cc3f6ab5a60c0d0e98e080d77989da169d4f75a2d397cacabc0415c1f60e  /tmp/screenshot-zopfli-baseline.cjs' | sha256sum -c -
          sh build/native-lib.sh libdeflate-source
          sh build/zopfli.sh zopfli-source
          wc -c vendor/zopfli.cjs vendor/libdeflate.wasm
          sha256sum vendor/zopfli.cjs vendor/libdeflate.wasm
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { inflateSync } from 'node:zlib';
          import { compressWithZopfli } from './zopfli.js';
          const raw = Buffer.from('the original raw image row '.repeat(200));
          const encoded = compressWithZopfli(raw);
          assert.deepEqual(inflateSync(encoded),raw);
          console.log('Verified Zopfli zlib stream',raw.length,encoded.length);
          JS
      - name: Compare both optimal parsers at equal iterations
        run: node check/zopfli-equivalence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zopfli-javascript
          path: |
            vendor/zopfli.cjs
            vendor/ZOPFLI-LICENSE
            vendor/libdeflate.wasm
            vendor/COPYING
      - name: Download the published practice set
        run: python3 check/fetch.py
      - name: Compare bounded Zopfli and native libdeflate on all eight screenshots
        run: node check/zopfli-practice.mjs
      - name: Verify a second, independently seeded set
        run: |
          mkdir -p check/seed
          node -e 'const fs=require("node:fs"), crypto=require("node:crypto");fs.writeFileSync("check/seed/seed.json", JSON.stringify({schema:"agent-fun/instance-seed/v1", seed:crypto.createHash("sha256").update("AtticKnight independent screenshot validation v1").digest("hex")}))'
          MAKEFUN_INPUT_DIR="$PWD/check/seed" MAKEFUN_OUTPUT_DIR="$PWD/check/holdout" node check/kit/program/generator/draw.ts
          node check/zopfli-practice.mjs check/holdout
