name: Verify screenshot compression
on:
  push:
    branches: [verify]
permissions:
  contents: read
jobs:
  practice:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Read the published practice data and checker
        run: python3 check/fetch.py
      - name: Check every pixel, compare the house entry and repeat under the 60-second limit
        run: node check/practice.mjs
