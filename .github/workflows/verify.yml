name: Verify screenshot compression
on:
  push:
    branches: [bench-png-wide-filter-frontier]
permissions:
  contents: read
jobs:
  practice:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Verify the JavaScript compressor with WebAssembly unavailable
        run: |
          node --no-expose-wasm --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { inflateSync } from 'node:zlib';
          import { compressOptimally } from './optimal.js';
          assert.equal(typeof WebAssembly, 'undefined');
          let samples = 0;
          for (const n of [1, 255, 4096, 120000, 1000000]) {
            for (const stride of [1, 5, 37]) {
              const bytes = Buffer.alloc(n);
              for (let i = 0; i < n; i++) bytes[i] = ((i / stride) ^ (i >>> 10)) & 255;
              assert.deepEqual(inflateSync(compressOptimally(bytes)), bytes);
              samples++;
            }
          }
          console.log('JavaScript round trips with WebAssembly unavailable', samples);
          JS
      - name: Check recompression of stored, fixed and dynamic DEFLATE streams
        run: node --no-expose-wasm check/repack.mjs
      - name: Read the published practice data and checker
        run: python3 check/fetch.py
      - name: Check every pixel, compare the house entry and repeat under the 60-second limit
        run: |
          python3 -c 'import os,sys; os.sched_setaffinity(0,{min(os.sched_getaffinity(0))}); os.execvp("node",["node","check/practice.mjs",*sys.argv[1:]])'
      - name: Verify the normal entry point on a new draw
        run: |
          mkdir -p check/third-seed
          node -e 'const fs=require("node:fs"), crypto=require("node:crypto");fs.writeFileSync("check/third-seed/seed.json", JSON.stringify({schema:"agent-fun/instance-seed/v1", seed:crypto.createHash("sha256").update("AtticKnight independently seeded screenshot validation 2026-11-27, third draw").digest("hex")}))'
          MAKEFUN_INPUT_DIR="$PWD/check/third-seed" MAKEFUN_OUTPUT_DIR="$PWD/check/third-draw" node check/kit/program/generator/draw.ts
          python3 -c 'import os,sys; os.sched_setaffinity(0,{min(os.sched_getaffinity(0))}); os.execvp("node",["node","check/practice.mjs",*sys.argv[1:]])' check/third-draw


  independent:
    name: Independent single-core set ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        seed: [four, five, six]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: python3 check/fetch.py
      - name: Draw another eight previously unseen screenshots
        env:
          DRAW_NAME: ${{ matrix.seed }}
        run: |
          mkdir -p check/fresh-seed
          node -e 'const fs=require("node:fs"), crypto=require("node:crypto");fs.writeFileSync("check/fresh-seed/seed.json",JSON.stringify({schema:"agent-fun/instance-seed/v1",seed:crypto.createHash("sha256").update("AtticKnight independent public PNG validation, draw "+process.env.DRAW_NAME).digest("hex")}))'
          MAKEFUN_INPUT_DIR="$PWD/check/fresh-seed" MAKEFUN_OUTPUT_DIR="$PWD/check/fresh-draw" node check/kit/program/generator/draw.ts
      - name: Run twice with one CPU and compare all RGBA pixels
        run: |
          python3 -c 'import os,sys; os.sched_setaffinity(0,{min(os.sched_getaffinity(0))}); os.execvp("node",["node","check/practice.mjs",*sys.argv[1:]])' check/fresh-draw

  official:
    name: Official Docker practice grade
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Extract the public kit and verify its CLI
        run: |
          mkdir -p "$RUNNER_TEMP/competition" "$RUNNER_TEMP/entry"
          python3 - <<'PY'
          import hashlib, os, tarfile
          from pathlib import Path, PurePosixPath
          from urllib.request import Request, urlopen
          from shutil import copyfileobj
          root = Path(os.environ['RUNNER_TEMP'], 'competition')
          req = Request('https://make.fun/c/png-squeeze-01-run-20261127/kit', headers={'User-Agent': 'AtticKnight public practice validation'})
          with urlopen(req, timeout=60) as response, tarfile.open(fileobj=response, mode='r|gz') as archive:
              for item in archive:
                  parts = PurePosixPath(item.name).parts
                  if not item.isfile() or len(parts) < 2 or '..' in parts or parts[0].startswith('/'):
                      continue
                  path = root.joinpath(*parts[1:])
                  path.parent.mkdir(parents=True, exist_ok=True)
                  with path.open('wb') as dest:
                      copyfileobj(archive.extractfile(item), dest)
          cli = root / 'cli' / 'makefun.mjs'
          assert hashlib.sha256(cli.read_bytes()).hexdigest() == 'c6bb345caa614f250942686dbad62e669c365b4ee582785667747b1119e84c70'
          PY
          git archive HEAD -- LICENSE README.md encoder.js main.ts optimal.js package.json repack.js vendor | tar -x -C "$RUNNER_TEMP/entry"
      - name: Run the sponsor's Docker grading command
        run: |
          cd "$RUNNER_TEMP/competition"
          node cli/makefun.mjs grade-local --kit . --bot "$RUNNER_TEMP/entry" --driver docker
